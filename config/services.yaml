# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
parameters:
    app.locale: 'en'
    app.notifications.email_sender: anonymous@example.com
    google-maps-key: AIzaSyAC3TNpVQ-XbwRJcuInXsp_aDf_jaYj3uY
    
    meta:
        color: "#ba1b0a"
        description: "List of Brno's cinemas"
        author: "hermajan"
        robots: "all,follow"
        
        title: ""
        separator: "-"
        name: "Žít kino"
    
    sluggable_entities:
        App\Models\Entities\CinemaType:
            controller: 'App\Controllers\CinemaController::type'
            route_name_prefix: 'cinema_type_'
    
services:
    # default configuration for services in *this* file
    _defaults:
        autowire: true      # Automatically injects dependencies in your services.
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.
        bind:
            # this allows to define the scalar arguments once and apply them to any services
            # defined/created in this file; if some argument is used rarely, instead of defining
            # it here you can use the #[Autowire] attribute to inject it manually in the service constructor
            array $enabledLocales: '%kernel.enabled_locales%'
            string $defaultLocale: '%kernel.default_locale%'

    # makes classes in src/ available to be used as services
    # this creates a service per class whose id is the fully-qualified class name
    App\:
        resource: '../src/'
        exclude:
            - '../src/Models/Entities/'
            - '../src/Kernel.php'

    # add more service definitions when explicit configuration is needed
    # please note that last definitions always *replace* previous ones

    App\Services\MetaService:
        arguments:
            - '%meta%'
            
#    App\Logging\DynamicFileHandler:
#        arguments:
#            $baseDir: '%kernel.logs_dir%/parsers'
#            $level: !php/const Monolog\Level::Debug
#            $bubble: false
            
    App\Logging\FileLoggerFactory:
        arguments:
            $baseDir: '%kernel.logs_dir%/parsers'
#            $baseLogger: '@monolog.logger.parsers'
    
    App\EasyAdmin\Translations\Configurator:
        arguments:
            $fieldConfigurators: !tagged_iterator ea.field_configurator
        tags:
            - { name: 'ea.field_configurator', priority: -10 }

    App\Routing\DatabaseSlugLoader:
        arguments:
            $sluggableEntities: '%sluggable_entities%'
        tags: ['routing.loader']

    App\EventSubscribers\RouteSubscriber:
        arguments:
            $sluggableEntities: '%sluggable_entities%'
            $cacheSystem: '@cache.system'
